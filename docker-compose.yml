services:

  db:
    image: postgres:16

    container_name: meeting-room-db

    environment:
      POSTGRES_DB: meeting_room
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: meeting-room-api

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env.docker

    depends_on:
      db:
        condition: service_healthy

  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: meeting-room-frontend

    ports:
    - "5500:80"

    depends_on:
      - api
      
volumes:
  postgres_data: