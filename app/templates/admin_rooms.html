{% extends "base.html" %}

{% block content %}

<h2>Управление комнатами</h2>

<form
    method="post"
    action="/admin/rooms"
    class="mb-4"
>

    <div class="mb-3">

        <label class="form-label">
            Название комнаты
        </label>

        <input
            type="text"
            name="room_name"
            class="form-control"
            required
        >

    </div>

    <button
        class="btn btn-success"
        type="submit"
    >
        Создать комнату
    </button>

</form>

<table class="table">

    <tr>
        <th>ID</th>
        <th>Название</th>
    </tr>

    {% for room in rooms %}

    <tr>

        <td>{{ room.id }}</td>

        <td>{{ room.name }}</td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
