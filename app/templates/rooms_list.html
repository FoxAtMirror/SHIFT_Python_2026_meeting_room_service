{% extends "base.html" %}

{% block content %}

<h2>Переговорные комнаты</h2>

<div class="list-group">

    {% for room in rooms %}

    <div class="list-group-item">

        <div class="d-flex justify-content-between align-items-center">

    <h5>{{ room.name }}</h5>

    <a
        href="/rooms/{{ room.id }}"
        class="btn btn-primary"
    >
        Открыть
    </a>

</div>

    </div>

    {% endfor %}

</div>

{% endblock %}
