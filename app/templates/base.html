<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Meeting Room Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            Meeting Room Service
        </a>

        {% if current_user %}

        <div>

            <span class="text-light me-3">

                {{ current_user.login }}

            </span>

            <a
                href="/rooms"
                class="btn btn-outline-light btn-sm me-2"
            >
                Комнаты
            </a>

            <a
            href="/my-bookings"
            class="btn btn-outline-light btn-sm me-2"
            >
                Мои бронирования
            </a>

            <a
                href="/logout"
                class="btn btn-outline-light btn-sm"
            >
                Выйти
            </a>

        </div>

        {% endif %}

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
