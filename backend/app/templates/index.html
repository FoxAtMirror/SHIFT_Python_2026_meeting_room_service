{% extends "base.html" %}

{% block content %}

    {{ current_user.login }}
</p>

{% else %}

<p>
    Пользователь не авторизован
</p>

{% endif %}

<div class="text-center">

    <h1>
        Meeting Room Booking Service

    <p class="lead">

    </p>

    <a
        href="/login"
        class="btn btn-primary"
    >
        Войти
    </a>

</div>

{% endblock %}
